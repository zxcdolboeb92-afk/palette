<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palette Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #b864ff;
            --accent-glow: rgba(184, 100, 255, 0.4);
            --bg-color: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --card-bg: rgba(255,255,255,0.03);
            --card-border: #333;
            --card-hover: rgba(255,255,255,0.05);
            --input-bg: rgba(255,255,255,0.05);
            --panel-bg: rgba(20, 20, 20, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --bg-gradient: radial-gradient(circle at 70% 30%, rgba(170, 0, 255, 0.08) 0%, rgba(10, 10, 10, 1) 50%);
        }

        body.light-theme {
            --bg-color: #f4f4f5;
            --text-main: #111111;
            --text-muted: #52525b;
            --card-bg: #ffffff;
            --card-border: #e4e4e7;
            --card-hover: #f4f4f5;
            --input-bg: #f4f4f5;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --panel-border: rgba(0, 0, 0, 0.1);
            --bg-gradient: radial-gradient(circle at 70% 30%, rgba(184, 100, 255, 0.15) 0%, rgba(244, 244, 245, 1) 50%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: var(--bg-gradient);
            transition: background-color 0.4s, color 0.4s;
        }

        a, button { text-decoration: none; color: inherit; font-family: inherit; cursor: pointer; border: none; background: none; }

        /* ШАПКА */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: var(--bg-color);
            border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 1000;
            flex-wrap: wrap; gap: 10px;
        }
        .logo { font-weight: 800; font-size: 20px; }
        .logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .nav-links button { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .nav-links button.active-tab { color: var(--accent); }
        
        .btn-primary {
            background-color: var(--accent); color: #fff !important; 
            padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; 
            display: flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .btn-primary:hover { background-color: #9d4edd; transform: translateY(-1px); }

        .theme-toggle { 
            position: relative; width: 64px; height: 32px; 
            background: rgba(128, 128, 128, 0.2); border: 1px solid var(--panel-border); 
            border-radius: 20px; display: flex; align-items: center; justify-content: space-between; 
            padding: 0 6px; cursor: pointer; transition: 0.4s;
        }
        .theme-toggle::before { 
            content: ''; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px; 
            background: var(--accent); border-radius: 50%; transition: transform 0.4s; z-index: 1; 
        }
        .light-theme .theme-toggle::before { transform: translateX(32px); background: #ffcc00; }
        .theme-icon { font-size: 14px; z-index: 2; pointer-events: none; }

        /* ГЛАВНЫЙ ЭКРАН */
        .hero { padding: 40px 30px; position: relative; min-height: 350px; display: flex; align-items: center; }
        .hero-title { font-size: 52px; font-weight: 800; line-height: 1.1; margin-bottom: 15px; }
        .hero-subtitle { font-size: 18px; color: var(--text-muted); }

        /* ЗВЕЗДЫ */
        .stars-container { position: absolute; top: 0; right: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
        .star {
            position: absolute; pointer-events: auto; cursor: crosshair; user-select: none;
            text-shadow: 0 2px 5px rgba(0,0,0,0.1);
            animation: floatStar 4s infinite ease-in-out alternate;
        }
        .star:hover { transform: scale(1.6) rotate(45deg); }
        @keyframes floatStar { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-15px) rotate(10deg); } }

        /* СЕКЦИИ */
        .itten-section, .photo-section { padding: 0 30px 30px; display: none; }
        .itten-section.active, .photo-section.active { display: block; }
        .itten-container, .photo-container { 
            background: var(--card-bg); border: 1px solid var(--card-border); 
            border-radius: 16px; padding: 25px; display: flex; gap: 30px; align-items: center; flex-wrap: wrap; 
        }
        
        /* Круг Иттена */
        .itten-wheel-wrapper { position: relative; width: 180px; height: 180px; flex-shrink: 0; }
        .itten-wheel { 
            width: 100%; height: 100%; border-radius: 50%; 
            background: conic-gradient(#ff0000, #ff8000, #ffff00, #80ff00, #00ff00, #00ff80, #00ffff, #0080ff, #0000ff, #8000ff, #ff00ff, #ff0080, #ff0000); 
            animation: spin 20s linear infinite; cursor: crosshair; 
        }
        .itten-wheel:hover { animation-play-state: paused; }
        .itten-wheel::after { 
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 100px; height: 100px; background: var(--bg-color); border-radius: 50%; pointer-events: none; 
        }
        .itten-wheel-wrapper::before { 
            content: '✦'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            z-index: 10; font-size: 35px; color: var(--accent); pointer-events: none; 
            animation: spin-center 10s linear infinite reverse; 
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-center { 50% { transform: rotate(-180deg) scale(1.2); } 100% { transform: rotate(-360deg) scale(1); } }

        .slider-container { 
            display: flex; align-items: center; gap: 15px; margin-bottom: 20px; 
            background: var(--input-bg); padding: 10px 15px; border-radius: 8px; width: fit-content; 
        }
        input[type=range] { -webkit-appearance: none; width: 150px; background: transparent; }
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; 
            background: var(--accent); cursor: pointer; 
        }
        
        .itten-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
        .itten-btn {
            background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main);
            padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; transition: 0.2s;
        }
        .itten-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* КАРТОЧКИ */
        .palette-section { padding: 20px 30px; }
        .section-title { font-size: 28px; font-weight: 800; margin-bottom: 20px; }
        .palette-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .card-wrapper { position: relative; }
        .color-card { 
            background: var(--card-bg); border: 1px solid var(--card-border); 
            border-radius: 16px; padding: 20px; display: flex; flex-direction: column; 
        }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-actions { display: flex; gap: 15px; }
        .action-btn { font-size: 20px; color: var(--text-muted); }
        .fav-btn.active { color: var(--accent); }

        .swatches-row { display: flex; flex-wrap: wrap; gap: 8px; cursor: pointer; }
        .swatch-wrapper { position: relative; }
        .color-swatch { width: 38px; height: 38px; border-radius: 50%; position: relative; cursor: pointer; }
        .color-input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; }
        .lock-indicator { 
            position: absolute; top: -2px; right: -2px; background: #000; border: 1px solid #555; 
            border-radius: 50%; width: 18px; height: 18px; font-size: 9px; 
            display: flex; justify-content: center; align-items: center; opacity: 0; color: var(--accent); 
        }
        .swatch-wrapper.locked .lock-indicator { opacity: 1; }

        .strip-container { display: none; flex-direction: column; gap: 5px; margin-top: 10px; }
        .strip-container.active { display: flex; }
        .color-strip { 
            display: flex; justify-content: space-between; align-items: center; 
            height: 35px; border-radius: 6px; padding: 0 10px; 
            font-family: monospace; font-size: 12px; font-weight: bold; color: #000; 
        }
        .color-strip.dark { color: #fff; }
        
        .lock-panel { display: flex; flex-direction: column; gap: 8px; max-height: 0; opacity: 0; overflow: hidden; transition: all 0.4s; }
        .card-wrapper:hover .lock-panel { max-height: 420px; opacity: 1; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--card-border); }
        .lock-item { display: flex; align-items: center; gap: 10px; background: var(--input-bg); padding: 6px 10px; border-radius: 8px; cursor: pointer; }
        .lock-color-dot { width: 16px; height: 16px; border-radius: 50%; }
        .lock-number { font-size: 13px; font-family: monospace; font-weight: bold; color: var(--text-muted); }
        .lock-icon-btn { font-size: 16px; color: var(--text-muted); margin-left: auto; }
        .lock-item.locked .lock-icon-btn { color: var(--accent); }

        /* ПРЕДПРОСМОТР */
        .preview-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 10000; display: none; justify-content: center; align-items: center; }
        .preview-modal.active { display: flex; }
        .preview-island { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 24px; width: 900px; max-width: 95%; display: flex; flex-direction: column; }
        .preview-header { padding: 20px; border-bottom: 1px solid var(--panel-border); display: flex; justify-content: space-between; }
        .preview-controls { padding: 20px; display: flex; gap: 20px; align-items: center; background: var(--input-bg); }
        .bg-color-btn { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
        .bg-color-btn.active { border-color: var(--text-main); }
        .preview-canvas { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 400px; transition: background 0.3s; }
        .mockup-ui { padding: 30px; border-radius: 16px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .mockup-btn { padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 12px 20px; border-radius: 8px; font-weight: bold; display: none; z-index: 99999; }
    </style>
</head>
<body>

    <div class="preview-modal" id="previewModal">
        <div class="preview-island">
            <div class="preview-header">
                <h3>Предпросмотр</h3>
                <button onclick="closePreview()">✕</button>
            </div>
            <div class="preview-controls">
                <div class="bg-colors" id="bgColors">
                    <button class="bg-color-btn" style="background: #ff3b30;" onclick="setPreviewBg('#ff3b30', this)"></button>
                    <button class="bg-color-btn" style="background: #34c759;" onclick="setPreviewBg('#34c759', this)"></button>
                    <button class="bg-color-btn" style="background: #007aff;" onclick="setPreviewBg('#007aff', this)"></button>
                    <button class="bg-color-btn" style="background: #000000;" onclick="setPreviewBg('#000000', this)"></button>
                    <button class="bg-color-btn" style="background: #ffffff; border: 2px solid #ccc;" onclick="setPreviewBg('#ffffff', this)"></button>
                </div>
            </div>
            <div class="preview-canvas" id="previewCanvas">
                <div class="mockup-ui" id="mockupUI">
                    <div style="font-size: 24px; font-weight: 800; margin-bottom: 10px;">Заголовок</div>
                    <div style="font-size: 14px; margin-bottom: 20px; opacity: 0.8;">Пример текста для оценки контраста.</div>
                    <button class="mockup-btn" id="mockupBtn">Кнопка</button>
                </div>
            </div>
        </div>
    </div>

    <header class="navbar">
        <div class="logo"><span>🎨</span> Palette Space</div>
        <nav class="nav-links">
            <button onclick="switchTab('all')" class="active-tab">Все палитры</button>
            <button onclick="switchTab('fav')">Избранное</button>
            <button onclick="switchTab('itten')">Круг Иттена</button>
            <button onclick="switchTab('photo')">📷 Из фото</button>
            <button id="fav-counter" style="color: var(--accent); font-weight: 800;">★ 0/20</button>
        </nav>
        <div style="display: flex; gap: 15px; align-items: center;">
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
                <span class="theme-icon">🌙</span>
                <span class="theme-icon">☀️</span>
            </button>
            <button onclick="generateNew()" class="btn-primary"><span>✦</span> Создать</button>
        </div>
    </header>

    <main class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Цвета, которые<br>создают будущее</h1>
            <p class="hero-subtitle">Блокируйте цвета, настраивайте их вручную.</p>
        </div>
        <div class="stars-container" id="stars-container"></div>
    </main>

    <section class="itten-section" id="section-itten">
        <div class="itten-container">
            <div class="itten-wheel-wrapper">
                <div class="itten-wheel" id="colorWheel"></div>
            </div>
            <div class="itten-controls">
                <h3>Генератор по кругу Иттена</h3>
                <div class="slider-container">
                    <label>Цветов: <span id="colorCountDisplay">3</span></label>
                    <input type="range" id="colorCount" min="2" max="8" value="3" oninput="document.getElementById('colorCountDisplay').innerText = this.value">
                </div>
                <div class="itten-buttons">
                    <button class="itten-btn" onclick="generateItten('complementary')">Комплементарная</button>
                    <button class="itten-btn" onclick="generateItten('triad')">Триада</button>
                    <button class="itten-btn" onclick="generateItten('tetrad')">Тетрада</button>
                </div>
            </div>
        </div>
    </section>

    <section class="photo-section" id="section-photo">
        <div class="photo-container" style="flex-direction: column; align-items: flex-start;">
            <h3>Палитра из фотографии</h3>
            <p style="color: var(--text-muted); margin-bottom: 15px;">Загрузите картинку, и мы вытащим из неё цвета.</p>
            <label class="itten-btn" style="cursor: pointer; display: inline-block;">
                Выбрать фото
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </label>
        </div>
    </section>

    <section id="palettes" class="palette-section">
        <h2 class="section-title">Все палитры</h2>
        <div id="palette-container" class="palette-container"></div>
    </section>

    <div id="toast">Уведомление</div>

    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') document.body.classList.add('light-theme');
        
        let savedPalettes = [];
        try { savedPalettes = JSON.parse(localStorage.getItem('spacePalettes')) || []; } catch(e) { savedPalettes = []; }
        const MAX_FAV = 20;

        function getRandomColor() {
            return hslToHex(Math.random() * 360, 50 + Math.random() * 30, 40 + Math.random() * 20);
        }
        function hexToHsl(hex) {
            let r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) { h = s = 0; } else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return [h * 360, s * 100, l * 100];
        }
        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
        }
        function isDark(hex) {
            const r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16);
            return (r * 299 + g * 587 + b * 114) / 1000 < 128;
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            document.getElementById('stars-container').innerHTML = '';
            initStars();
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active-tab'));
            document.getElementById('section-itten').classList.remove('active');
            document.getElementById('section-photo').classList.remove('active');
            document.getElementById('palettes').style.display = 'none';

            if (tab === 'itten') { document.getElementById('section-itten').classList.add('active'); }
            else if (tab === 'photo') { document.getElementById('section-photo').classList.add('active'); }
            else {
                document.getElementById('palettes').style.display = 'block';
                document.querySelectorAll('.card-wrapper').forEach(c => {
                    if (tab === 'all' || c.getAttribute('data-fav') === 'true') c.classList.remove('hidden');
                    else c.classList.add('hidden');
                });
            }
        }

        // Круг Иттена
        document.getElementById('colorWheel').addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let angle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * (180 / Math.PI);
            if (angle < 0) angle += 360;
            
            const count = parseInt(document.getElementById('colorCount').value);
            let colors = [];
            const angleStep = 360 / count;
            for (let i = 0; i < count; i++) {
                colors.push(hslToHex((angle + i * angleStep) % 360, 70, 50));
            }
            addPaletteToContainer(colors);
        });

        function generateItten(scheme) {
            const baseHex = getRandomColor();
            const count = parseInt(document.getElementById('colorCount').value);
            const [h, s, l] = hexToHsl(baseHex);
            let colors = [];
            if (scheme === 'complementary') colors = [hslToHex(h, s, l), hslToHex((h + 180) % 360, s, l)];
            else if (scheme === 'triad') colors = [hslToHex(h, s, l), hslToHex((h + 120) % 360, s, l), hslToHex((h + 240) % 360, s, l)];
            else if (scheme === 'tetrad') colors = [hslToHex(h, s, l), hslToHex((h + 90) % 360, s, l), hslToHex((h + 180) % 360, s, l), hslToHex((h + 270) % 360, s, l)];
            
            while (colors.length < count) colors.push(getRandomColor());
            addPaletteToContainer(colors.slice(0, count));
        }

        function generateNew() {
            const count = parseInt(document.getElementById('colorCount').value);
            let colors = [];
            for (let i = 0; i < count; i++) colors.push(getRandomColor());
            addPaletteToContainer(colors);
        }

        function addPaletteToContainer(colors) {
            const container = document.getElementById('palette-container');
            container.insertBefore(buildCard(colors), container.firstChild);
            document.getElementById('palettes').scrollIntoView({ behavior: 'smooth' });
            showToast('Создана палитра!');
        }

        // Загрузка из фото
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 100; canvas.height = 100;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 100, 100);
                    const data = ctx.getImageData(0, 0, 100, 100).data;
                    const colorMap = {};
                    for (let i = 0; i < data.length; i += 4) {
                        if (data[i+3] < 128) continue;
                        const q = v => Math.min(255, Math.round(v / 20) * 20);
                        const hex = rgbToHex(q(data[i]), q(data[i+1]), q(data[i+2]));
                        colorMap[hex] = (colorMap[hex] || 0) + 1;
                    }
                    const sorted = Object.keys(colorMap).sort((a, b) => colorMap[b] - colorMap[a]);
                    const finalColors = [];
                    for (let hex of sorted) {
                        if (finalColors.length >= 5) break;
                        let unique = true;
                        for (let c of finalColors) if (Math.hypot(...[1,3,5].map(i => parseInt(c.substr(i,2),16) - parseInt(hex.substr(i,2),16))) < 40) { unique = false; break; }
                        if (unique) finalColors.push(hex);
                    }
                    while (finalColors.length < 5) finalColors.push(getRandomColor());
                    addPaletteToContainer(finalColors);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
        function rgbToHex(r, g, b) { return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase(); }

        function buildCard(colors, isSaved = false, existingId = null) {
            let circlesHTML = '', stripsHTML = '', lockHTML = '';
            const cardId = existingId || 'id_' + Math.random().toString(36).substr(2, 9);

            colors.forEach((c, i) => {
                circlesHTML += `<div class="swatch-wrapper" id="swatch-${i}">
                    <div class="color-swatch" style="background: ${c};">
                        <input type="color" class="color-input" value="${c}" onchange="changeColor(this, ${i}, '${cardId}')">
                    </div>
                    <div class="lock-indicator">🔒</div>
                </div>`;
                stripsHTML += `<div class="color-strip ${isDark(c) ? 'dark' : ''}" style="background: ${c};" onclick="copyHex('${c}')">
                    <span>${i + 1}. ${c}</span>
                </div>`;
                lockHTML += `<div class="lock-item" id="lock-item-${i}" onclick="toggleLock(${i}, this, event)">
                    <div class="lock-color-dot" style="background: ${c};"></div>
                    <div class="lock-number">${i + 1}</div>
                    <div class="lock-icon-btn">🔒</div>
                </div>`;
            });

            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.setAttribute('data-fav', isSaved ? 'true' : 'false');
            wrapper.setAttribute('data-colors', JSON.stringify(colors));
            wrapper.setAttribute('data-id', cardId);

            wrapper.innerHTML = `
                <div class="color-card">
                    <div class="card-header">
                        <h3>Палитра</h3>
                        <div class="card-actions">
                            <button class="action-btn" onclick="openPreview(this)">👁</button>
                            <button class="action-btn fav-btn ${isSaved ? 'active' : ''}" onclick="toggleFav(this, '${cardId}')">${isSaved ? '★' : '☆'}</button>
                        </div>
                    </div>
                    <div class="swatches-row" onclick="this.style.display='none'; this.nextElementSibling.classList.add('active');">${circlesHTML}</div>
                    <div class="strip-container" onclick="if(!event.target.classList.contains('color-strip')) { this.previousElementSibling.style.display='flex'; this.classList.remove('active'); }">${stripsHTML}</div>
                    <div class="lock-panel">${lockHTML}</div>
                </div>
            `;
            return wrapper;
        }

        function changeColor(input, index, cardId) {
            const wrapper = input.closest('.card-wrapper');
            const colors = JSON.parse(wrapper.getAttribute('data-colors'));
            colors[index] = input.value.toUpperCase();
            wrapper.setAttribute('data-colors', JSON.stringify(colors));
            wrapper.querySelectorAll('.color-swatch')[index].style.background = colors[index];
            const p = savedPalettes.find(p => p.id === cardId);
            if (p) { p.colors = colors; localStorage.setItem('spacePalettes', JSON.stringify(savedPalettes)); }
        }

        function copyHex(hex) { navigator.clipboard.writeText(hex).then(() => showToast(hex + ' скопирован!')); }

        function openPreview(btn) {
            const colors = JSON.parse(btn.closest('.card-wrapper').getAttribute('data-colors'));
            let vibrant = colors[0], maxSat = 0;
            colors.forEach(c => { let s = hexToHsl(c)[1]; if (s > maxSat) { maxSat = s; vibrant = c; } });

            const ui = document.getElementById('mockupUI');
            ui.style.backgroundColor = '#ffffff'; ui.style.color = '#000000';
            const btnMock = document.getElementById('mockupBtn');
            btnMock.style.backgroundColor = vibrant;
            btnMock.style.color = isDark(vibrant) ? '#ffffff' : '#000000';

            document.getElementById('previewCanvas').style.backgroundColor = '#ffffff';
            document.getElementById('previewModal').classList.add('active');
        }

        function closePreview() { document.getElementById('previewModal').classList.remove('active'); }
        function setPreviewBg(color, btn) {
            document.querySelectorAll('.bg-color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('previewCanvas').style.backgroundColor = color;
        }

        function toggleFav(btn, cardId) {
            const wrapper = btn.closest('.card-wrapper');
            const isFav = wrapper.getAttribute('data-fav') === 'true';
            const colors = JSON.parse(wrapper.getAttribute('data-colors'));

            if (!isFav) {
                if (savedPalettes.length < MAX_FAV) {
                    btn.classList.add('active'); btn.innerText = '★';
                    wrapper.setAttribute('data-fav', 'true');
                    savedPalettes.push({ id: cardId, colors });
                    localStorage.setItem('spacePalettes', JSON.stringify(savedPalettes));
                } else showToast('Лимит 20');
            } else {
                btn.classList.remove('active'); btn.innerText = '☆';
                wrapper.setAttribute('data-fav', 'false');
                savedPalettes = savedPalettes.filter(p => p.id !== cardId);
                localStorage.setItem('spacePalettes', JSON.stringify(savedPalettes));
            }
            document.getElementById('fav-counter').innerText = `★ ${savedPalettes.length} / ${MAX_FAV}`;
        }

        function toggleLock(index, element, event) {
            event.stopPropagation();
            element.classList.toggle('locked');
            element.closest('.card-wrapper').querySelector(`#swatch-${index}`).classList.toggle('locked');
        }

        // ИСПРАВЛЕННАЯ АНИМАЦИЯ ЗВЕЗД
        function initStars() {
            const container = document.getElementById('stars-container');
            container.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                const star = document.createElement('div'); 
                star.className = 'star';
                star.innerText = ['✦', '✧', '★', '☆'][Math.floor(Math.random() * 4)];
                star.style.left = (Math.random() * 90 + 5) + '%'; 
                star.style.top = (Math.random() * 80 + 10) + '%';
                star.style.fontSize = (Math.random() * 15 + 10) + 'px';
                star.style.color = ['#fff', '#b864ff', '#a1a1aa'][Math.floor(Math.random() * 3)];
                
                star.onclick = function(e) {
                    e.stopPropagation();
                    
                    // Получаем текущее положение звезды на экране
                    const rect = star.getBoundingClientRect();
                    const parentRect = container.getBoundingClientRect();
                    
                    // Переводим в локальные координаты контейнера
                    const startX = rect.left - parentRect.left;
                    const startY = rect.top - parentRect.top;
                    
                    // Отключаем анимацию парения
                    star.style.animation = 'none';
                    
                    // Фиксируем текущее положение (в пикселях)
                    star.style.left = startX + 'px';
                    star.style.top = startY + 'px';
                    star.style.transform = 'scale(1) rotate(0deg)';
                    
                    // Ждем 1 кадр, чтобы браузер применил новые координаты
                    requestAnimationFrame(() => {
                        // Включаем плавный переход
                        star.style.transition = 'all 0.8s ease-out';
                        
                        // Рассчитываем случайное смещение для полета
                        const moveX = (Math.random() - 0.5) * 300;
                        const moveY = (Math.random() - 0.5) * 300;
                        
                        // Запускаем полет
                        star.style.transform = `translate(${moveX}px, ${moveY}px) scale(3) rotate(360deg)`;
                        star.style.opacity = '0';
                        
                        // Через 800мс телепортируем и возрождаем
                        setTimeout(() => {
                            star.style.transition = 'none';
                            star.style.transform = 'none';
                            star.style.opacity = '0';
                            // Новое случайное место
                            star.style.left = (Math.random() * 90 + 5) + '%';
                            star.style.top = (Math.random() * 80 + 10) + '%';
                            
                            // Возвращаем видимость
                            setTimeout(() => {
                                star.style.transition = 'opacity 0.3s';
                                star.style.opacity = Math.random() * 0.5 + 0.3;
                                
                                // Включаем анимацию парения обратно
                                setTimeout(() => { 
                                    star.style.animation = 'floatStar 4s infinite ease-in-out alternate'; 
                                }, 50);
                            }, 50);
                        }, 800);
                    });
                };
                container.appendChild(star);
            }
        }

        window.onload = function() {
            const container = document.getElementById('palette-container');
            if (savedPalettes.length > 0) {
                savedPalettes.forEach(p => container.appendChild(buildCard(p.colors, true, p.id)));
            } else {
                for (let i = 0; i < 3; i++) {
                    const colors = []; const count = Math.floor(Math.random() * 4) + 3;
                    for (let j = 0; j < count; j++) colors.push(getRandomColor());
                    container.appendChild(buildCard(colors));
                }
            }
            initStars(); 
            document.getElementById('fav-counter').innerText = `★ ${savedPalettes.length} / ${MAX_FAV}`;
        };
    </script>
</body>
</html>
