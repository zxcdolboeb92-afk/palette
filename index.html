<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palette Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 70% 30%, rgba(170, 0, 255, 0.08) 0%, rgba(10, 10, 10, 1) 50%);
        }
        
        :root {
            --accent: #b864ff;
            --accent-glow: rgba(184, 100, 255, 0.4);
        }

        a, button { text-decoration: none; color: inherit; font-family: inherit; cursor: pointer; border: none; background: none; }

        /* ШАПКА */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; background: rgba(10,10,10,0.9);
            border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo { font-weight: 800; font-size: 18px; }
        .logo span { color: var(--accent); }
        
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links button { font-size: 14px; color: #a1a1aa; font-weight: 500; transition: 0.2s; }
        .nav-links button:hover { color: #fff; }
        .nav-links button.active-tab { color: var(--accent); }
        
        .btn-primary {
            background-color: var(--accent); color: #fff !important;
            padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: 0.2s;
            display: flex; align-items: center; gap: 5px;
        }
        .btn-primary:hover { background-color: #9d4edd; transform: translateY(-1px); box-shadow: 0 4px 15px var(--accent-glow); }

        /* ГЛАВНЫЙ ЭКРАН */
        .hero { 
            position: relative; max-width: 1200px; margin: 0 auto; padding: 80px 40px; 
            min-height: 450px; display: flex; align-items: center; 
        }
        .hero-content { max-width: 600px; position: relative; z-index: 2; }
        .hero-title { font-size: 56px; font-weight: 800; line-height: 1.1; margin-bottom: 20px; letter-spacing: -2px; }
        .hero-subtitle { font-size: 18px; color: #a1a1aa; line-height: 1.6; }

        /* ЗВЕЗДОЧКИ */
        .stars-container { 
            position: absolute; top: 0; right: 0; width: 50%; height: 100%; 
            pointer-events: none; z-index: 1; overflow: visible;
        }
        .star {
            position: absolute; pointer-events: auto; cursor: crosshair; user-select: none;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 20px currentColor; 
            transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            animation: float 4s infinite ease-in-out alternate;
        }
        .star:hover { transform: scale(1.6) rotate(45deg); color: #ffffff; text-shadow: 0 0 30px #fff, 0 0 60px var(--accent); }
        .star.flying { opacity: 0; transform: scale(4) rotate(360deg); filter: blur(5px); }

        /* СЕКЦИЯ ЦВЕТОВОГО КРУГА */
        .itten-section { max-width: 1200px; margin: 0 auto; padding: 0 40px 40px; position: relative; z-index: 5; }
        .itten-container {
            background: rgba(10, 10, 10, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(184, 100, 255, 0.15); border-radius: 20px; padding: 30px; 
            display: flex; gap: 40px; align-items: center; flex-wrap: wrap;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3), inset 0 0 20px rgba(184, 100, 255, 0.05);
        }
        .itten-wheel-wrapper { position: relative; width: 200px; height: 200px; display: flex; justify-content: center; align-items: center; }
        .itten-wheel {
            width: 200px; height: 200px; border-radius: 50%; position: relative;
            background: conic-gradient(#ff0000, #ff8000, #ffff00, #80ff00, #00ff00, #00ff80, #00ffff, #0080ff, #0000ff, #8000ff, #ff00ff, #ff0080, #ff0000);
            box-shadow: 0 0 30px rgba(255,255,255,0.1), inset 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair; animation: spin 20s linear infinite; transition: box-shadow 0.3s;
        }
        .itten-wheel:hover { animation-play-state: paused; box-shadow: 0 0 40px var(--accent-glow), inset 0 0 20px rgba(0,0,0,0.5); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .itten-wheel::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 120px; height: 120px; background: #0a0a0a; border-radius: 50%; box-shadow: inset 0 0 10px rgba(0,0,0,1);
            pointer-events: none;
        }
        .itten-wheel-wrapper::before {
            content: '✦'; position: absolute; z-index: 10; font-size: 40px; color: var(--accent);
            text-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 20px var(--accent); pointer-events: none;
            animation: spin-center 10s linear infinite reverse; 
        }
        @keyframes spin-center { 50% { transform: rotate(-180deg) scale(1.2); } 100% { transform: rotate(-360deg) scale(1); } }
        
        .itten-controls { flex: 1; min-width: 300px; }
        .itten-controls h3 { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
        .itten-controls p { color: #a1a1aa; margin-bottom: 20px; font-size: 15px; }
        .itten-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
        .itten-btn {
            background: rgba(255,255,255,0.05); border: 1px solid #444; color: #fff;
            padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; transition: 0.2s;
        }
        .itten-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); color: var(--accent); }

        /* КАРТОЧКИ */
        .palette-section { max-width: 1200px; margin: 0 auto; padding: 40px; }
        .section-title { font-size: 32px; font-weight: 800; margin-bottom: 30px; }
        .palette-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

        .color-card {
            background: rgba(255,255,255,0.03); border: 1px solid #333;
            border-radius: 16px; padding: 20px; transition: 0.3s; animation: fadeIn 0.5s ease;
            position: relative;
        }
        .color-card.hidden { display: none !important; }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-header h3 { font-size: 18px; }
        .card-actions { display: flex; gap: 10px; align-items: center; }
        
        /* Кнопки в карточке (избранное и скачать) */
        .action-btn { font-size: 20px; color: #555; transition: 0.2s; padding: 4px; }
        .action-btn:hover { transform: scale(1.15); color: #fff; }
        .fav-btn.active { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

        /* Кружочки с замочками */
        .swatches-row { display: flex; flex-wrap: wrap; gap: 10px; }
        .swatch-wrapper { position: relative; cursor: pointer; }
        .color-swatch { width: 45px; height: 45px; border-radius: 50%; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .color-swatch:hover { transform: scale(1.1); }
        
        /* Замочек */
        .lock-icon {
            position: absolute; top: -5px; right: -5px; background: #000; border: 1px solid #555;
            border-radius: 50%; width: 20px; height: 20px; font-size: 10px;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: 0.2s; pointer-events: none;
        }
        .swatch-wrapper:hover .lock-icon { opacity: 1; }
        .swatch-wrapper.locked .lock-icon { opacity: 1; border-color: var(--accent); color: var(--accent); }

        /* Развернутые полоски с контрастом */
        .strip-container { display: none; flex-direction: column; gap: 10px; margin-top: 10px; }
        .strip-container.active { display: flex; }
        .color-strip {
            display: flex; justify-content: space-between; align-items: center;
            height: 45px; border-radius: 12px; padding: 0 15px; 
            font-family: monospace; font-size: 14px; font-weight: bold; color: #000;
            cursor: pointer; transition: 0.2s;
        }
        .color-strip:hover { transform: translateX(5px); }
        .color-strip.dark { color: #fff; }

        .contrast-badges { display: flex; gap: 5px; font-family: 'Inter', sans-serif; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; border: 1px solid transparent; }
        .badge-pass { background: rgba(0, 255, 0, 0.2); border-color: rgba(0, 255, 0, 0.5); color: #000; }
        .badge-fail { background: rgba(255, 0, 0, 0.2); border-color: rgba(255, 0, 0, 0.5); color: #000; }
        .color-strip.dark .badge-pass { color: #fff; background: rgba(0, 255, 0, 0.4); }
        .color-strip.dark .badge-fail { color: #fff; background: rgba(255, 0, 0, 0.4); }

        /* История в шапке */
        .history-btns { display: flex; gap: 5px; margin-left: 15px; border-left: 1px solid #333; padding-left: 15px; }
        .history-btn { color: #a1a1aa; font-size: 18px; transition: 0.2s; }
        .history-btn:hover:not(:disabled) { color: #fff; }
        .history-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 8px;
            font-weight: bold; display: none; z-index: 9999; box-shadow: 0 5px 15px var(--accent-glow);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"><span>🎨</span> Palette Space</div>
        <nav class="nav-links">
            <button onclick="switchTab('all')" id="tab-all" class="active-tab">Все палитры</button>
            <button onclick="switchTab('fav')" id="tab-fav">Избранное</button>
            
            <!-- История -->
            <div class="history-btns">
                <button class="history-btn" id="undoBtn" onclick="undo()" title="Назад" disabled>↶</button>
                <button class="history-btn" id="redoBtn" onclick="redo()" title="Вперед" disabled>↷</button>
            </div>

            <button id="fav-counter" style="color: var(--accent); font-weight: 800; cursor: default; margin-left: 15px;">★ 0 / 20</button>
        </nav>
        <button onclick="generateNew()" class="btn-primary">✨ Создать палитру</button>
    </header>

    <main class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Цвета, которые<br>создают будущее</h1>
            <p class="hero-subtitle">Блокируйте понравившиеся цвета, проверяйте контрастность и скачивайте палитры в один клик.</p>
        </div>
        <div class="stars-container" id="stars-container"></div>
    </main>

    <section class="itten-section">
        <div class="itten-container">
            <div class="itten-wheel-wrapper">
                <div class="itten-wheel" id="colorWheel" title="Кликни в любую точку круга"></div>
            </div>
            <div class="itten-controls">
                <h3>Генератор по кругу Иттена</h3>
                <p>Кликни по кругу, чтобы выбрать базовый цвет, или выбери готовую схему ниже.</p>
                <div class="itten-buttons">
                    <button class="itten-btn" onclick="generateItten('complementary')">Комплементарная</button>
                    <button class="itten-btn" onclick="generateItten('triad')">Триада</button>
                    <button class="itten-btn" onclick="generateItten('tetrad')">Тетрада</button>
                    <button class="itten-btn" onclick="generateItten('analogous')">Аналогичная</button>
                </div>
            </div>
        </div>
    </section>

    <section id="palettes" class="palette-section">
        <h2 class="section-title" id="section-title">Все палитры</h2>
        <div id="palette-container" class="palette-container"></div>
    </section>

    <div id="toast">Уведомление</div>

    <script>
        let favCount = 0;
        const MAX_FAV = 20;
        let currentTab = 'all';
        let savedPalettes = JSON.parse(localStorage.getItem('spacePalettes')) || [];
        
        // История
        let history = [];
        let historyIndex = -1;

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) color += letters[Math.floor(Math.random() * 16)];
            return color;
        }

        function hexToHsl(hex) {
            let r = parseInt(hex.slice(1, 3), 16) / 255;
            let g = parseInt(hex.slice(3, 5), 16) / 255;
            let b = parseInt(hex.slice(5, 7), 16) / 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) { h = s = 0; } 
            else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return [h * 360, s * 100, l * 100];
        }

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
        }

        // Контраст (WCAG)
        function getContrastYIQ(hexcolor) {
            var r = parseInt(hexcolor.substr(1,2),16);
            var g = parseInt(hexcolor.substr(3,2),16);
            var b = parseInt(hexcolor.substr(5,2),16);
            var yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? 'dark' : 'light'; // 'dark' значит текст должен быть черным
        }

        function getLuminance(hex) {
            let rgb = hex.replace('#', '').match(/.{1,2}/g).map(val => parseInt(val, 16) / 255);
            rgb = rgb.map(val => val <= 0.03928 ? val / 12.92 : Math.pow((val + 0.055) / 1.055, 2.4));
            return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
        }

        function getContrastRatio(hex1, hex2) {
            const lum1 = getLuminance(hex1);
            const lum2 = getLuminance(hex2);
            const brightest = Math.max(lum1, lum2);
            const darkest = Math.min(lum1, lum2);
            return (brightest + 0.05) / (darkest + 0.05);
        }

        function getContrastBadge(bgHex, textHex) {
            const ratio = getContrastRatio(bgHex, textHex);
            if (ratio >= 7) return `<span class="badge badge-pass">AAA</span>`;
            if (ratio >= 4.5) return `<span class="badge badge-pass">AA</span>`;
            return `<span class="badge badge-fail">Fail</span>`;
        }

        // --- КЛИК ПО КРУГУ ---
        const colorWheel = document.getElementById('colorWheel');
        colorWheel.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const x = e.clientX - centerX;
            const y = e.clientY - centerY;
            
            let angle = Math.atan2(y, x) * (180 / Math.PI);
            if (angle < 0) angle += 360;
            
            const randomS = Math.floor(Math.random() * 30) + 40; 
            const randomL = Math.floor(Math.random() * 20) + 40; 

            const hexColor = hslToHex(angle, randomS, randomL); 
            createPaletteFromBase(hexColor, 'triad', 'Выбранный вами цвет');
        });

        function generateItten(scheme) {
            const baseHex = getRandomColor();
            createPaletteFromBase(baseHex, scheme, scheme);
        }

        function createPaletteFromBase(baseHex, scheme, msgPrefix) {
            const [h, s, l] = hexToHsl(baseHex);
            let colors = [];
            const niceS = Math.max(30, Math.min(s + (Math.random() * 20 - 10), 90)); 
            const niceL = Math.max(30, Math.min(l + (Math.random() * 20 - 10), 70));

            if (scheme === 'complementary') {
                colors = [hslToHex(h, niceS, niceL), hslToHex((h + 180) % 360, niceS, niceL)];
            } else if (scheme === 'triad') {
                colors = [hslToHex(h, niceS, niceL), hslToHex((h + 120) % 360, niceS, Math.min(niceL + 10, 80)), hslToHex((h + 240) % 360, Math.max(niceS - 10, 30), Math.max(niceL - 10, 30))];
            } else if (scheme === 'tetrad') {
                colors = [hslToHex(h, niceS, niceL), hslToHex((h + 90) % 360, niceS, niceL), hslToHex((h + 180) % 360, niceS, niceL), hslToHex((h + 270) % 360, niceS, niceL)];
            } else if (scheme === 'analogous') {
                colors = [hslToHex((h - 30 + 360) % 360, niceS, niceL), hslToHex(h, niceS, niceL), hslToHex((h + 30) % 360, niceS, niceL)];
            }

            const container = document.getElementById('palette-container');
            const card = buildCard(colors);
            container.insertBefore(card, container.firstChild);
            
            addToHistory(colors);
            
            if (currentTab !== 'all') switchTab('all');
            document.getElementById('palettes').scrollIntoView({ behavior: 'smooth' });
            showToast(`Создана палитра: ${msgPrefix}`);
        }

        // --- ИСТОРИЯ ---
        function addToHistory(colors) {
            // Удаляем все, что было впереди, если мы нажали Undo
            history = history.slice(0, historyIndex + 1);
            history.push(colors);
            historyIndex++;
            updateHistoryButtons();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                renderHistoryState();
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                renderHistoryState();
            }
        }

        function renderHistoryState() {
            const container = document.getElementById('palette-container');
            container.innerHTML = ''; // Очищаем всё
            
            // Восстанавливаем только текущий элемент истории
            const card = buildCard(history[historyIndex]);
            container.appendChild(card);
            
            // Восстанавливаем избранное
            savedPalettes.forEach(p => container.appendChild(buildCard(p.colors, true)));

            updateHistoryButtons();
            updateCounter();
        }

        function updateHistoryButtons() {
            document.getElementById('undoBtn').disabled = historyIndex <= 0;
            document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
        }

        // --- КАРТОЧКА ---
        function buildCard(colors, isSaved = false) {
            let circlesHTML = '';
            let stripsHTML = '';

            colors.forEach((c, i) => {
                // Бейджи контрастности
                const badgeBlack = getContrastBadge(c, '#000000');
                const badgeWhite = getContrastBadge(c, '#ffffff');
                
                circlesHTML += `
                    <div class="swatch-wrapper" onclick="toggleLock(this, event)">
                        <div class="color-swatch" style="background: ${c};" title="Скопировать: ${c}"></div>
                        <div class="lock-icon">🔒</div>
                    </div>
                `;
                
                const darkClass = isDark(c) ? 'dark' : '';
                const textColor = isDark(c) ? '#fff' : '#000';
                
                stripsHTML += `
                    <div class="color-strip ${darkClass}" style="background: ${c};" onclick="event.stopPropagation(); showToast('Цвет ${c} скопирован!')">
                        <span>${i + 1}. ${c}</span>
                        <div class="contrast-badges">
                            ${getContrastBadge(c, '#000000').replace('badge-pass', 'badge-pass').replace('badge-fail', 'badge-fail')}
                            ${getContrastBadge(c, '#ffffff')}
                        </div>
                    </div>
                `;
            });

            const card = document.createElement('div');
            card.className = 'color-card';
            card.setAttribute('data-fav', isSaved ? 'true' : 'false');
            card.setAttribute('data-colors', JSON.stringify(colors));

            card.innerHTML = `
                <div class="card-header">
                    <h3>Палитра</h3>
                    <div class="card-actions">
                        <button class="action-btn fav-btn ${isSaved ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav(this)" title="В избранное">${isSaved ? '★' : '☆'}</button>
                        <button class="action-btn" onclick="event.stopPropagation(); downloadPalette(this)" title="Скачать">⬇</button>
                    </div>
                </div>
                <div class="swatches-row">${circlesHTML}</div>
                <div class="strip-container">${stripsHTML}</div>
            `;

            const circlesRow = card.querySelector('.swatches-row');
            const stripsCol = card.querySelector('.strip-container');

            // Разворот при клике на пустое место
            circlesRow.onclick = function(e) {
                if(e.target.closest('.swatch-wrapper')) return; // Если кликнули на кружок, не разворачиваем
                circlesRow.style.display = 'none';
                stripsCol.classList.add('active');
            };

            stripsCol.onclick = function(e) {
                if(e.target.classList.contains('color-strip')) return; 
                circlesRow.style.display = 'flex';
                stripsCol.classList.remove('active');
            };

            return card;
        }

        // --- ЗАМОРОЗКА ЦВЕТА ---
        function toggleLock(element, event) {
            event.stopPropagation();
            element.classList.toggle('locked');
            
            // Копируем цвет при клике
            const color = element.querySelector('.color-swatch').style.backgroundColor;
            navigator.clipboard.writeText(rgbToHex(color));
            showToast(`Цвет скопирован!`);
        }

        function rgbToHex(rgb) {
            if(rgb.startsWith('#')) return rgb;
            const parts = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
            if (!parts) return rgb;
            return "#" + ((1 << 24) + (parseInt(parts[1]) << 16) + (parseInt(parts[2]) << 8) + parseInt(parts[3])).toString(16).slice(1).toUpperCase();
        }

        // --- СКАЧИВАНИЕ КАРТИНКИ ---
        function downloadPalette(btn) {
            const card = btn.closest('.color-card');
            const colors = JSON.parse(card.getAttribute('data-colors'));
            
            const canvas = document.createElement('canvas');
            canvas.width = 1000;
            canvas.height = 1000;
            const ctx = canvas.getContext('2d');

            // Фон
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, 1000, 1000);

            // Цветные полосы
            const stripeHeight = 1000 / colors.length;
            colors.forEach((c, i) => {
                ctx.fillStyle = c;
                ctx.fillRect(0, i * stripeHeight, 1000, stripeHeight);
                
                // Текст (HEX)
                ctx.fillStyle = isDark(c) ? '#ffffff' : '#000000';
                ctx.font = 'bold 40px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(c, 500, i * stripeHeight + stripeHeight / 2);
            });

            // Подпись
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.font = 'bold 30px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('Palette Space', 950, 950);

            // Скачивание
            const link = document.createElement('a');
            link.download = 'palette.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('Картинка сохранена!');
        }

        // --- ИЗБРАННОЕ ---
        function toggleFav(btn) {
            const card = btn.closest('.color-card');
            const isCurrentlyFav = card.getAttribute('data-fav') === 'true';
            const currentColors = JSON.parse(card.getAttribute('data-colors'));

            if (!isCurrentlyFav) {
                if (favCount < MAX_FAV) {
                    btn.classList.add('active');
                    btn.innerText = '★';
                    card.setAttribute('data-fav', 'true');
                    savedPalettes.push({ colors: currentColors });
                    saveToLocalStorage();
                    favCount++;
                } else {
                    showToast(`Лимит избранного (${MAX_FAV})`);
                }
            } else {
                btn.classList.remove('active');
                btn.innerText = '☆';
                card.setAttribute('data-fav', 'false');
                const index = savedPalettes.findIndex(p => p.colors.join('') === currentColors.join(''));
                if (index !== -1) {
                    savedPalettes.splice(index, 1);
                    saveToLocalStorage();
                }
                favCount--;
            }
            updateCounter();
            if (currentTab === 'fav' && card.getAttribute('data-fav') === 'false') {
                card.classList.add('hidden');
            }
        }

        function updateCounter() {
            document.getElementById('fav-counter').innerText = `★ ${favCount} / ${MAX_FAV}`;
        }

        function saveToLocalStorage() {
            localStorage.setItem('spacePalettes', JSON.stringify(savedPalettes));
        }

        // --- ГЕНЕРАЦИЯ НОВОЙ (С УЧЕТОМ ЗАМОРОЗКИ) ---

            let newColors = [];
            let colorCount = Math.floor(Math.random() * 5) + 2;

            if (firstCard) {
                const oldColors = JSON.parse(firstCard.getAttribute('data-colors'));
                const swatchWrappers = firstCard.querySelectorAll('.swatch-wrapper');
                let hasLocked = false;

                oldColors.forEach((c, i) => {
                    if (swatchWrappers[i].classList.contains('locked')) {
                        newColors.push(c);
                        hasLocked = true;
                    } else {
                        newColors.push(getRandomColor());
                    }
                });

                if (!hasLocked && newColors.length !== colorCount) {
                    newColors = [];
                    for (let i = 0; i < colorCount; i++) newColors.push(getRandomColor());
                }
            } else {
                for (let i = 0; i < colorCount; i++) newColors.push(getRandomColor());
            }

            const container = document.getElementById('palette-container');
            const newCard = buildCard(newColors);
            container.insertBefore(newCard, container.firstChild);
            
            addToHistory(newColors);
            
            if (currentTab !== 'all') switchTab('all');
            showToast('Создана новая палитра!');
            updateCounter();
        }
