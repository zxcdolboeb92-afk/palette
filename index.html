<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palette Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 70% 30%, rgba(201, 255, 52, 0.05) 0%, rgba(10, 10, 10, 1) 50%);
        }

        a, button { text-decoration: none; color: inherit; font-family: inherit; cursor: pointer; border: none; background: none; }

        /* ШАПКА */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; background: rgba(10,10,10,0.9);
            border-bottom: 1px solid #222;
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .logo { font-weight: 800; font-size: 18px; }
        .logo span { color: #c9ff34; }
        
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a, .nav-links button { font-size: 14px; color: #a1a1aa; font-weight: 500; transition: 0.2s; }
        .nav-links a:hover, .nav-links button:hover { color: #fff; }
        
        .nav-links button.active-tab { color: #c9ff34; }
        
        .btn-primary {
            background-color: #c9ff34; color: #000 !important;
            padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px;
            transition: 0.2s;
        }
        .btn-primary:hover { background-color: #b8eb25; transform: translateY(-1px); }

        /* ГЛАВНЫЙ ЭКРАН С ИНТЕРАКТИВОМ */
        .hero { 
            position: relative; max-width: 1200px; margin: 0 auto; padding: 80px 40px; 
            min-height: 400px; display: flex; align-items: center;
        }
        .hero-content { max-width: 600px; position: relative; z-index: 2; }
        .hero-title { font-size: 56px; font-weight: 800; line-height: 1.1; margin-bottom: 20px; letter-spacing: -2px;}
        .hero-subtitle { font-size: 18px; color: #a1a1aa; line-height: 1.6; margin-bottom: 30px; }

        /* ИНТЕРАКТИВНЫЕ ЗВЕЗДОЧКИ */
        .stars-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: hidden; z-index: 1;
        }
        .star {
            position: absolute;
            color: rgba(255, 255, 255, 0.2); /* Полупрозрачные */
            font-size: 24px;
            pointer-events: auto; /* Чтобы с ними можно было взаимодействовать */
            cursor: crosshair;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s;
            user-select: none;
        }
        /* Эффект при наведении (отталкивание) */
        .star:hover { transform: scale(1.5) rotate(45deg); color: rgba(201, 255, 52, 0.8); }
        /* Эффект при клике (взрыв) */
        .star.clicked { transform: scale(3) rotate(180deg); color: #c9ff34; opacity: 0; }

        /* КАРТОЧКИ */
        .palette-section { max-width: 1200px; margin: 0 auto; padding: 40px; }
        .section-title { font-size: 32px; font-weight: 800; margin-bottom: 30px; }
        .palette-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

        .color-card {
            background: rgba(255,255,255,0.03); border: 1px solid #333;
            border-radius: 16px; padding: 20px; transition: 0.3s;
        }
        .color-card:hover { border-color: #555; transform: translateY(-3px); background: rgba(255,255,255,0.05); }
        
        /* Скрытие карточек в зависимости от вкладки */
        .color-card.hidden { display: none; }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-header h3 { font-size: 18px; }
        .fav-btn { font-size: 24px; color: #555; transition: 0.2s; }
        .fav-btn:hover { transform: scale(1.1); }
        .fav-btn.active { color: #c9ff34; }

        .swatches-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; cursor: pointer; }
        .color-swatch { width: 45px; height: 45px; border-radius: 50%; transition: 0.2s; }
        .color-swatch:hover { transform: scale(1.1); }

        /* БОЛЕЕ СКРУГЛЕННЫЕ ПОЛОСКИ */
        .strip-container { display: none; flex-direction: column; gap: 10px; margin-top: 10px;}
        .strip-container.active { display: flex; }
        .color-strip {
            display: flex; align-items: center; height: 45px; 
            border-radius: 12px; /* Более скругленные */
            padding: 0 20px;
            font-family: monospace; font-size: 15px; font-weight: bold; color: #000;
            cursor: pointer; transition: 0.2s;
        }
        .color-strip:hover { transform: translateX(5px); }
        .color-strip.dark { color: #fff; }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #c9ff34; color: #000; padding: 10px 20px; border-radius: 8px;
            font-weight: bold; display: none; z-index: 9999; box-shadow: 0 5px 15px rgba(201,255,52,0.3);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"><span>🎨</span> Palette Space</div>
        <nav class="nav-links">
            <button onclick="switchTab('all')" id="tab-all" class="active-tab">Все палитры</button>
            <button onclick="switchTab('fav')" id="tab-fav">Избранное</button>
            <button onclick="switchTab('gen')" id="tab-gen">Генератор</button>
            <button id="fav-counter" style="color: #c9ff34; font-weight: 800; cursor: default;">★ 0 / 20</button>
        </nav>
        <button onclick="generateNew()" class="btn-primary">Создать палитру</button>
    </header>

    <main class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Цвета, которые<br>создают будущее</h1>
            <p class="hero-subtitle">
                Исследуйте, создавайте и сохраняйте идеальные цветовые палитры. Поиграйте со звездочками справа!
            </p>
        </div>
        <!-- Контейнер для интерактивных звезд -->
        <div class="stars-container" id="stars-container"></div>
    </main>

    <section id="palettes" class="palette-section">
        <h2 class="section-title" id="section-title">Все палитры</h2>
        <div id="palette-container" class="palette-container"></div>
    </section>

    <div id="toast">Уведомление</div>

    <script>
        let favCount = 0;
        const MAX_FAV = 20; // Увеличили до 20

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) color += letters[Math.floor(Math.random() * 16)];
            return color;
        }

        function isDark(hex) {
            const r = parseInt(hex.substr(1, 2), 16);
            const g = parseInt(hex.substr(3, 2), 16);
            const b = parseInt(hex.substr(5, 2), 16);
            return (r * 299 + g * 587 + b * 114) / 1000 < 128;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        // --- ЛОГИКА СОЗДАНИЯ КАРТОЧЕК ---
        function createCard() {
            const colorCount = Math.floor(Math.random() * 5) + 2; // 2-6 цветов
            let circlesHTML = '';
            let stripsHTML = '';

            for (let i = 0; i < colorCount; i++) {
                const c = getRandomColor();
                circlesHTML += `<div class="color-swatch" style="background: ${c};" title="Скопировать цвет" onclick="event.stopPropagation(); showToast('Цвет ${c.toUpperCase()} скопирован!')"></div>`;
                const darkClass = isDark(c) ? 'dark' : '';
                stripsHTML += `<div class="color-strip ${darkClass}" style="background: ${c};" onclick="event.stopPropagation(); showToast('Цвет ${c.toUpperCase()} скопирован!')">${i + 1}. ${c.toUpperCase()}</div>`;
            }

            const card = document.createElement('div');
            card.className = 'color-card';
            card.setAttribute('data-fav', 'false');
            card.innerHTML = `
                <div class="card-header">
                    <h3>Палитра</h3>
                    <button class="fav-btn" onclick="event.stopPropagation(); toggleFav(this)">☆</button>
                </div>
                <!-- Кружки -->
                <div class="swatches-row">
                    ${circlesHTML}
                </div>
                <!-- Полоски -->
                <div class="strip-container">
                    ${stripsHTML}
                </div>
            `;

            // Логика разворачивания/сворачивания по клику на область
            const circlesRow = card.querySelector('.swatches-row');
            const stripsCol = card.querySelector('.strip-container');

            // Клик по кружкам -> показать полоски
            circlesRow.onclick = function() {
                circlesRow.style.display = 'none';
                stripsCol.classList.add('active');
            };

            // Клик по полоскам (в пустое место) -> вернуть кружки
            stripsCol.onclick = function() {
                circlesRow.style.display = 'flex';
                stripsCol.classList.remove('active');
            };

            return card;
        }

        function generateNew() {
            const container = document.getElementById('palette-container');
            const newCard = createCard();
            container.insertBefore(newCard, container.firstChild);
            
            // Если мы не на вкладке "Все", переключим на неё, чтобы увидеть новую палитру
            if (currentTab !== 'all') switchTab('all');
            
            showToast('Создана новая палитра!');
        }

        // --- ИЗБРАННОЕ ---
        function toggleFav(btn) {
            const card = btn.closest('.color-card');
            
            if (!btn.classList.contains('active')) {
                if (favCount < MAX_FAV) {
                    btn.classList.add('active');
                    btn.innerText = '★';
                    card.setAttribute('data-fav', 'true');
                    favCount++;
                } else {
                    showToast(`Лимит избранного достигнут (${MAX_FAV})`);
                }
            } else {
                btn.classList.remove('active');
                btn.innerText = '☆';
                card.setAttribute('data-fav', 'false');
                favCount--;
            }
            document.getElementById('fav-counter').innerText = `★ ${favCount} / ${MAX_FAV}`;
            
            // Если мы на вкладке избранное, скрываем карточку сразу после снятия лайка
            if (currentTab === 'fav' && card.getAttribute('data-fav') === 'false') {
                card.classList.add('hidden');
            }
        }

        // --- ВКЛАДКИ ---
        let currentTab = 'all';

        function switchTab(tab) {
            currentTab = tab;
            
            // Обновляем активные кнопки в меню
            document.getElementById('tab-all').classList.remove('active-tab');
            document.getElementById('tab-fav').classList.remove('active-tab');
            document.getElementById('tab-gen').classList.remove('active-tab');
            
            document.getElementById('tab-' + tab).classList.add('active-tab');

            const cards = document.querySelectorAll('.color-card');
            const title = document.getElementById('section-title');

            if (tab === 'all') {
                title.innerText = 'Все палитры';
                cards.forEach(c => c.classList.remove('hidden'));
            } 
            else if (tab === 'fav') {
                title.innerText = 'Ваше избранное';
                cards.forEach(c => {
                    if (c.getAttribute('data-fav') === 'true') {
                        c.classList.remove('hidden');
                    } else {
                        c.classList.add('hidden');
                    }
                });
                if (favCount === 0) showToast('Вы пока не добавили ни одной палитры в избранное');
            }
            else if (tab === 'gen') {
                // "Генератор" просто создает новую палитру и перекидывает на "Все"
                generateNew();
            }
        }

        // --- ИНТЕРАКТИВНЫЕ ЗВЕЗДОЧКИ ---
        function initStars() {
            const container = document.getElementById('stars-container');
            const starCount = 40; // Количество звезд

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerText = ['✦', '✧', '★', '☆'][Math.floor(Math.random() * 4)]; // Разные символы
                
                // Случайная позиция в пределах контейнера
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                star.style.left = x + '%';
                star.style.top = y + '%';
                
                // Случайный размер
                const size = Math.random() * 20 + 10;
                star.style.fontSize = size + 'px';
                
                // Случайная прозрачность
                star.style.opacity = Math.random() * 0.5 + 0.1;

                // Эффект при клике на звезду
                star.onclick = function(e) {
                    e.stopPropagation();
                    star.classList.add('clicked');
                    // Возвращаем звезду в исходное состояние через полсекунды
                    setTimeout(() => {
                        star.classList.remove('clicked');
                        // Перемещаем в новое место
                        star.style.left = (Math.random() * 100) + '%';
                        star.style.top = (Math.random() * 100) + '%';
                    }, 400);
                };

                container.appendChild(star);
            }
        }

        // Запуск при загрузке
        window.onload = function() {
            const container = document.getElementById('palette-container');
            for (let i = 0; i < 3; i++) container.appendChild(createCard());
            initStars(); // Создаем звезды
        };
    </script>
</body>
</html>
