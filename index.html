<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palette Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 70% 30%, rgba(170, 0, 255, 0.08) 0%, rgba(10, 10, 10, 1) 50%);
        }
        
        :root {
            --accent: #b864ff;
            --accent-glow: rgba(184, 100, 255, 0.4);
        }

        a, button { text-decoration: none; color: inherit; font-family: inherit; cursor: pointer; border: none; background: none; }

        /* --- СЕКРЕТНЫЙ ЖИДКИЙ ОСТРОВОК --- */
        .secret-island {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 15px 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.1);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
        }

        .secret-island.show {
            top: 90px;
        }

        .secret-text {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            z-index: 2;
            white-space: nowrap;
        }

        .close-island {
            font-size: 18px;
            color: #a1a1aa;
            transition: 0.2s;
            z-index: 3;
            margin-left: 10px;
        }
        .close-island:hover { color: #fff; transform: scale(1.2); }

        .island-stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .island-star {
            position: absolute;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            animation: floatIsland 3s infinite ease-in-out alternate;
        }
        @keyframes floatIsland {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
            100% { transform: translateY(-10px) rotate(20deg); opacity: 0.8; }
        }

        /* ШАПКА */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: rgba(10,10,10,0.9);
            border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 1000; /* Высокий z-index, чтобы не перекрывали звезды */
            backdrop-filter: blur(10px);
        }
        .logo { font-weight: 800; font-size: 20px; z-index: 10; position: relative; }
        .logo span { color: var(--accent); }
        
        .nav-links { display: flex; gap: 20px; align-items: center; z-index: 10; position: relative; }
        .nav-links button { font-size: 14px; color: #a1a1aa; font-weight: 500; transition: 0.2s; }
        .nav-links button:hover { color: #fff; }
        .nav-links button.active-tab { color: var(--accent); }
        
        .btn-primary {
            background-color: var(--accent); color: #fff !important;
            padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: 0.2s;
            display: flex; align-items: center; gap: 6px; white-space: nowrap;
            z-index: 10; position: relative;
        }
        .btn-primary:hover { background-color: #9d4edd; transform: translateY(-1px); box-shadow: 0 4px 15px var(--accent-glow); }
        .btn-primary .star-icon { font-size: 16px; line-height: 1; }

        /* ГЛАВНЫЙ ЭКРАН */
        .hero { padding: 40px 30px; position: relative; min-height: 350px; display: flex; align-items: center; }
        .hero-content { max-width: 600px; position: relative; z-index: 2; }
        .hero-title { font-size: 52px; font-weight: 800; line-height: 1.1; margin-bottom: 15px; letter-spacing: -2px; }
        .hero-subtitle { font-size: 18px; color: #a1a1aa; line-height: 1.6; }

        /* ЗВЕЗДОЧКИ */
        .stars-container { 
            position: absolute; top: 0; right: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 1; overflow: hidden;
        }
        .star {
            position: absolute; pointer-events: auto; cursor: crosshair; user-select: none;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 20px currentColor; 
            transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            animation: float 4s infinite ease-in-out alternate;
        }
        .star:hover { transform: scale(1.6) rotate(45deg); color: #ffffff; text-shadow: 0 0 30px #fff, 0 0 60px var(--accent); }
        .star.flying { opacity: 0; transform: scale(4) rotate(360deg); filter: blur(5px); }
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-15px) rotate(10deg); } }

        /* СЕКЦИЯ ЦВЕТОВОГО КРУГА */
        .itten-section { padding: 0 30px 30px; position: relative; z-index: 10; /* Выше звезд, чтобы работал клик */ }
        .itten-container {
            background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(12px);
            border: 1px solid rgba(184, 100, 255, 0.15); border-radius: 16px; padding: 25px; 
            display: flex; gap: 30px; align-items: center; flex-wrap: wrap;
        }
        .itten-wheel-wrapper { position: relative; width: 180px; height: 180px; display: flex; justify-content: center; align-items: center; }
        .itten-wheel {
            width: 180px; height: 180px; border-radius: 50%;
            background: conic-gradient(#ff0000, #ff8000, #ffff00, #80ff00, #00ff00, #00ff80, #00ffff, #0080ff, #0000ff, #8000ff, #ff00ff, #ff0080, #ff0000);
            box-shadow: 0 0 30px rgba(255,255,255,0.1), inset 0 0 20px rgba(0,0,0,0.5);
            animation: spin 20s linear infinite;
            cursor: crosshair;
        }
        /* Останавливаем при наведении */
        .itten-wheel:hover { animation-play-state: paused; box-shadow: 0 0 40px var(--accent-glow); }
        
        .itten-wheel::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100px; height: 100px; background: #0a0a0a; border-radius: 50%; box-shadow: inset 0 0 10px rgba(0,0,0,1);
            pointer-events: none;
        }
        .itten-wheel-wrapper::before {
            content: '✦'; position: absolute; z-index: 10; font-size: 35px; color: var(--accent);
            text-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 20px var(--accent); pointer-events: none;
            animation: spin-center 10s linear infinite reverse; 
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-center { 50% { transform: rotate(-180deg) scale(1.2); } 100% { transform: rotate(-360deg) scale(1); } }
        
        .itten-controls h3 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
        .itten-controls p { color: #a1a1aa; margin-bottom: 15px; font-size: 14px; }
        .itten-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
        .itten-btn {
            background: rgba(255,255,255,0.05); border: 1px solid #444; color: #fff;
            padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
        }
        .itten-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); color: var(--accent); }

        /* КАРТОЧКИ */
        .palette-section { padding: 20px 30px; position: relative; z-index: 5; }
        .section-title { font-size: 28px; font-weight: 800; margin-bottom: 20px; }
        .palette-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

        .card-wrapper { position: relative; }
        .color-card {
            background: rgba(255,255,255,0.03); border: 1px solid #333;
            border-radius: 16px; padding: 20px;
            display: flex; flex-direction: column;
            transition: 0.3s;
        }
        .color-card:hover { border-color: #555; background: rgba(255,255,255,0.05); }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-header h3 { font-size: 16px; }
        .card-actions { display: flex; gap: 15px; }
        .action-btn { font-size: 22px; color: #555; padding: 5px; transition: 0.2s; }
        .action-btn:hover { color: #fff; transform: scale(1.1); }
        .fav-btn.active { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

        /* Кружочки */
        .swatches-row { display: flex; flex-wrap: wrap; gap: 10px; cursor: pointer; }
        .swatch-wrapper { position: relative; }
        .color-swatch { width: 45px; height: 45px; border-radius: 50%; }
        
        .lock-indicator {
            position: absolute; top: -2px; right: -2px; background: #000; border: 1px solid #555;
            border-radius: 50%; width: 20px; height: 20px; font-size: 10px;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; color: var(--accent);
        }
        .swatch-wrapper.locked .lock-indicator { opacity: 1; }

        /* Полоски */
        .strip-container { display: none; flex-direction: column; gap: 8px; margin-top: 15px; }
        .strip-container.active { display: flex; }
        .color-strip {
            display: flex; justify-content: space-between; align-items: center;
            height: 40px; border-radius: 8px; padding: 0 15px; 
            font-family: monospace; font-size: 13px; font-weight: bold; color: #000;
        }
        .color-strip.dark { color: #fff; }
        .contrast-badges { display: flex; gap: 5px; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; }
        .badge-pass { background: rgba(0, 255, 0, 0.2); color: #000; }
        .badge-fail { background: rgba(255, 0, 0, 0.2); color: #000; }
        .color-strip.dark .badge-pass { color: #fff; background: rgba(0, 255, 0, 0.4); }
        .color-strip.dark .badge-fail { color: #fff; background: rgba(255, 0, 0, 0.4); }

        /* --- ПАНЕЛЬ ЗАМКОВ (Выезжает СПРАВА) --- */
        .lock-panel {
            display: none; /* Скрыта на телефоне */
        }

        /* История */
        .history-btns { display: flex; gap: 5px; border-left: 1px solid #333; padding-left: 10px; margin-left: 5px; }
        .history-btn { color: #a1a1aa; font-size: 18px; font-weight: bold; padding: 0 5px;}
        .history-btn:disabled { opacity: 0.3; }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: #fff; padding: 12px 20px; border-radius: 8px;
            font-weight: bold; display: none; z-index: 9999; width: 90%; text-align: center;
        }

        /* --- ВЕРСИЯ ДЛЯ ПК (ЭКРАНЫ ОТ 1024px) --- */
        @media (min-width: 1024px) {
            .navbar { padding: 20px 40px; }
            .nav-links { gap: 25px; }
            
            .hero { padding: 80px 40px; min-height: 450px; }
            .hero-title { font-size: 64px; }
            
            .itten-section { padding: 0 40px 40px; }
            .itten-container { gap: 40px; }
            .itten-wheel-wrapper { width: 220px; height: 220px; }
            .itten-wheel { width: 220px; height: 220px; }
            .itten-wheel::after { width: 130px; height: 130px; }

            .palette-section { padding: 40px; }
            .palette-container { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
            .color-card { padding: 25px; }
            .card-header h3 { font-size: 18px; }
            .swatches-row { justify-content: flex-start; }
            .color-swatch { width: 50px; height: 50px; }

            /* Выезд панели справа при наведении */
            .lock-panel {
                display: flex;
                flex-direction: column;
                gap: 10px;
                position: absolute;
                right: -20px; /* Выезжает за правый край карточки */
                top: 50%;
                transform: translateY(-50%) translateX(10px); /* Прячем внутрь */
                background: #111;
                border: 1px solid #333;
                border-radius: 16px 0 0 16px; /* Скругление слева */
                padding: 15px;
                z-index: 1;
                opacity: 0;
                pointer-events: none;
                transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
                box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            }
            /* При наведении выезжает вправо */
            .card-wrapper:hover .lock-panel {
                transform: translateY(-50%) translateX(100%);
                opacity: 1;
                pointer-events: auto;
            }

            .lock-item {
                display: flex; align-items: center; gap: 10px;
                background: rgba(255,255,255,0.05); padding: 8px 12px;
                border-radius: 8px; cursor: pointer; transition: 0.2s;
            }
            .lock-item:hover { background: rgba(255,255,255,0.1); }
            .lock-color-dot { width: 20px; height: 20px; border-radius: 50%; }
            .lock-number { font-size: 14px; font-family: monospace; font-weight: bold; color: #a1a1aa; }
            .lock-icon-btn { font-size: 18px; color: #555; margin-left: 5px; }
            .lock-item.locked .lock-icon-btn { color: var(--accent); }

            .secret-island { padding: 20px 50px; gap: 20px; }
            .secret-text { font-size: 22px; letter-spacing: 2px; }
            .secret-island.show { top: 100px; }
        }
    </style>
</head>
<body>

    <!-- СЕКРЕТНЫЙ ОСТРОВОК -->
    <div class="secret-island" id="secretIsland">
        <div class="island-stars" id="islandStars"></div>
        <div class="secret-text">Помни, я тебя очень люблю</div>
        <button class="close-island" onclick="closeIsland()">✕</button>
    </div>

    <header class="navbar">
        <div class="logo"><span>🎨</span> Palette Space</div>
        <nav class="nav-links">
            <button onclick="switchTab('all')" id="tab-all" class="active-tab">Все палитры</button>
            <button onclick="switchTab('fav')" id="tab-fav">Избранное</button>
            
            <div class="history-btns">
                <button class="history-btn" id="undoBtn" onclick="undo()" disabled>↶</button>
                <button class="history-btn" id="redoBtn" onclick="redo()" disabled>↷</button>
            </div>
            <button id="fav-counter" style="color: var(--accent); font-weight: 800; cursor: default;">★ 0/20</button>
        </nav>
        <button onclick="generateNew()" class="btn-primary"><span class="star-icon">✦</span> Создать</button>
    </header>

    <main class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Цвета, которые<br>создают будущее</h1>
            <p class="hero-subtitle">Блокируйте цвета, проверяйте контрастность и скачивайте палитры.</p>
        </div>
        <div class="stars-container" id="stars-container"></div>
    </main>

    <section class="itten-section">
        <div class="itten-container">
            <div class="itten-wheel-wrapper">
                <div class="itten-wheel" id="colorWheel"></div>
            </div>
            <div class="itten-controls">
                <h3>Круг Иттена</h3>
                <p>Кликни по кругу или выбери схему:</p>
                <div class="itten-buttons">
                    <button class="itten-btn" onclick="generateItten('complementary')">Комплементарная</button>
                    <button class="itten-btn" onclick="generateItten('triad')">Триада</button>
                    <button class="itten-btn" onclick="generateItten('tetrad')">Тетрада</button>
                    <button class="itten-btn" onclick="generateItten('analogous')">Аналогичная</button>
                </div>
            </div>
        </div>
    </section>

    <section id="palettes" class="palette-section">
        <h2 class="section-title" id="section-title">Все палитры</h2>
        <div id="palette-container" class="palette-container"></div>
    </section>

    <div id="toast">Уведомление</div>

    <script>
        let favCount = 0;
        const MAX_FAV = 20;
        let currentTab = 'all';
        let savedPalettes = JSON.parse(localStorage.getItem('spacePalettes')) || [];
        
        // Запоминаем, открывал ли пользователь секретный островок
        let secretUnlocked = localStorage.getItem('secretUnlocked') === 'true';

        let history = [];
        let historyIndex = -1;

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) color += letters[Math.floor(Math.random() * 16)];
            return color;
        }

        function hexToHsl(hex) {
            let r = parseInt(hex.slice(1, 3), 16) / 255;
            let g = parseInt(hex.slice(3, 5), 16) / 255;
            let b = parseInt(hex.slice(5, 7), 16) / 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) { h = s = 0; } 
            else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return [h * 360, s * 100, l * 100];
        }

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
        }

        function getLuminance(hex) {
            let rgb = hex.replace('#', '').match(/.{1,2}/g).map(val => parseInt(val, 16) / 255);
            rgb = rgb.map(val => val <= 0.03928 ? val / 12.92 : Math.pow((val + 0.055) / 1.055, 2.4));
            return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
        }

        function getContrastRatio(hex1, hex2) {
            const lum1 = getLuminance(hex1);
            const lum2 = getLuminance(hex2);
            const brightest = Math.max(lum1, lum2);
            const darkest = Math.min(lum1, lum2);
            return (brightest + 0.05) / (darkest + 0.05);
        }

        function getContrastBadge(bgHex, textHex) {
            const ratio = getContrastRatio(bgHex, textHex);
            if (ratio >= 7) return `<span class="badge badge-pass">AAA</span>`;
            if (ratio >= 4.5) return `<span class="badge badge-pass">AA</span>`;
            return `<span class="badge badge-fail">Fail</span>`;
        }

        const colorWheel = document.getElementById('colorWheel');
        colorWheel.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const x = e.clientX - centerX;
            const y = e.clientY - centerY;
            
            let angle = Math.atan2(y, x) * (180 / Math.PI);
            if (angle < 0) angle += 360;
            
            const randomS = Math.floor(Math.random() * 30) + 40; 
            const randomL = Math.floor(Math.random() * 20) + 40; 

            const hexColor = hslToHex(angle, randomS, randomL); 
            createPaletteFromBase(hexColor, 'triad', 'Выбранный вами цвет');
        });

        function generateItten(scheme) {
            const baseHex = getRandomColor();
            createPaletteFromBase(baseHex, scheme, scheme);
        }

        function createPaletteFromBase(baseHex, scheme, msgPrefix) {
            const [h, s, l] = hexToHsl(baseHex);
            let colors = [];
            const niceS = Math.max(30, Math.min(s + (Math.random() * 20 - 10), 90)); 
            const niceL = Math.max(30, Math.min(l + (Math.random() * 20 - 10), 70));

            if (scheme === 'complementary') {
                colors = [hslToHex(h, niceS, niceL), hslToHex((h + 180) % 360, niceS, niceL)];
            } else if (scheme === 'triad') {
                colors = [hslToHex(h, niceS, niceL), hslToHex((h + 120) % 360, niceS, Math.min(niceL + 10, 80)), hslToHex((h + 240) % 360, Math.max(niceS - 10, 30), Math.max(niceL - 10, 30))];
            } else if (scheme === 'tetrad') {
                colors = [hslToHex(h, niceS, niceL), hslToHex((h + 90) % 360, niceS, niceL), hslToHex((h + 180) % 360, niceS, niceL), hslToHex((h + 270) % 360, niceS, niceL)];
            } else if (scheme === 'analogous') {
                colors = [hslToHex((h - 30 + 360) % 360, niceS, niceL), hslToHex(h, niceS, niceL), hslToHex((h + 30) % 360, niceS, niceL)];
            }

            const container = document.getElementById('palette-container');
            const card = buildCard(colors);
            container.insertBefore(card, container.firstChild);
            
            addToHistory(colors);
            
            if (currentTab !== 'all') switchTab('all');
            document.getElementById('palettes').scrollIntoView({ behavior: 'smooth' });
            showToast(`Создана палитра: ${msgPrefix}`);
        }

        function addToHistory(colors) {
            history = history.slice(0, historyIndex + 1);
            history.push(colors);
            historyIndex++;
            updateHistoryButtons();
        }

        function undo() {
            if (historyIndex > 0) { historyIndex--; renderHistoryState(); }
        }

        function redo() {
            if (historyIndex < history.length - 1) { historyIndex++; renderHistoryState(); }
        }

        function renderHistoryState() {
            const container = document.getElementById('palette-container');
            container.innerHTML = ''; 
            container.appendChild(buildCard(history[historyIndex]));
            savedPalettes.forEach(p => container.appendChild(buildCard(p.colors, true)));
            updateHistoryButtons();
            updateCounter();
        }

        function updateHistoryButtons() {
            document.getElementById('undoBtn').disabled = historyIndex <= 0;
            document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
        }

        function buildCard(colors, isSaved = false) {
            let circlesHTML = '';
            let stripsHTML = '';
            let lockPanelHTML = '';

            colors.forEach((c, i) => {
                circlesHTML += `
                    <div class="swatch-wrapper" id="swatch-${i}">
                        <div class="color-swatch" style="background: ${c};"></div>
                        <div class="lock-indicator">🔒</div>
                    </div>
                `;
                
                const darkClass = isDark(c) ? 'dark' : '';
                
                stripsHTML += `
                    <div class="color-strip ${darkClass}" style="background: ${c};" onclick="event.stopPropagation(); showToast('Цвет ${c} скопирован!')">
                        <span>${i + 1}. ${c}</span>
                        <div class="contrast-badges">
                            ${getContrastBadge(c, '#000000')}
                            ${getContrastBadge(c, '#ffffff')}
                        </div>
                    </div>
                `;

                lockPanelHTML += `
                    <div class="lock-item" id="lock-item-${i}" onclick="toggleLock(${i}, this, event)">
                        <div class="lock-color-dot" style="background: ${c};"></div>
                        <div class="lock-number">${i + 1}</div>
                        <div class="lock-icon-btn">🔒</div>
                    </div>
                `;
            });

            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.setAttribute('data-fav', isSaved ? 'true' : 'false');
            wrapper.setAttribute('data-colors', JSON.stringify(colors));

            wrapper.innerHTML = `
                <div class="color-card">
                    <div class="card-header">
                        <h3>Палитра</h3>
                        <div class="card-actions">
                            <button class="action-btn fav-btn ${isSaved ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav(this)">${isSaved ? '★' : '☆'}</button>
                            <button class="action-btn" onclick="event.stopPropagation(); downloadPalette(this)">⬇</button>
                        </div>
                    </div>
                    <div class="swatches-row">${circlesHTML}</div>
                    <div class="strip-container">${stripsHTML}</div>
                </div>
                <div class="lock-panel">
                    ${lockPanelHTML}
                </div>
            `;

            const circlesRow = wrapper.querySelector('.swatches-row');
            const stripsCol = wrapper.querySelector('.strip-container');

            circlesRow.onclick = function() {
                circlesRow.style.display = 'none';
                stripsCol.classList.add('active');
            };

            stripsCol.onclick = function(e) {
                if(e.target.classList.contains('color-strip')) return; 
                circlesRow.style.display = 'flex';
                stripsCol.classList.remove('active');
            };

            return wrapper;
        }

        function toggleLock(index, element, event) {
            event.stopPropagation();
            element.classList.toggle('locked');
            const swatchWrapper = element.closest('.card-wrapper').querySelector(`#swatch-${index}`);
            if (swatchWrapper) swatchWrapper.classList.toggle('locked');
        }

        function downloadPalette(btn) {
            const wrapper = btn.closest('.card-wrapper');
            const colors = JSON.parse(wrapper.getAttribute('data-colors'));
            
            const canvas = document.createElement('canvas');
            canvas.width = 1000;
            canvas.height = 1000;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, 1000, 1000);

            const stripeHeight = 1000 / colors.length;
            colors.forEach((c, i) => {
                ctx.fillStyle = c;
                ctx.fillRect(0, i * stripeHeight, 1000, stripeHeight);
                ctx.fillStyle = isDark(c) ? '#ffffff' : '#000000';
                ctx.font = 'bold 40px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(c, 500, i * stripeHeight + stripeHeight / 2);
            });

            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.font = 'bold 30px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('Palette Space', 950, 950);

            const link = document.createElement('a');
            link.download = 'palette.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('Картинка сохранена!');
        }

        function toggleFav(btn) {
            const wrapper = btn.closest('.card-wrapper');
            const isCurrentlyFav = wrapper.getAttribute('data-fav') === 'true';
            const currentColors = JSON.parse(wrapper.getAttribute('data-colors'));

            if (!isCurrentlyFav) {
                if (favCount < MAX_FAV) {
                    btn.classList.add('active');
                    btn.innerText = '★';
                    wrapper.setAttribute('data-fav', 'true');
                    savedPalettes.push({ colors: currentColors });
                    saveToLocalStorage();
                    favCount++;
                } else {
                    showToast(`Лимит избранного (${MAX_FAV})`);
                }
            } else {
                btn.classList.remove('active');
                btn.innerText = '☆';
                wrapper.setAttribute('data-fav', 'false');
                const index = savedPalettes.findIndex(p => p.colors.join('') === currentColors.join(''));
                if (index !== -1) {
                    savedPalettes.splice(index, 1);
                    saveToLocalStorage();
                }
                favCount--;
            }
            updateCounter();
            if (currentTab === 'fav' && wrapper.getAttribute('data-fav') === 'false') {
                wrapper.classList.add('hidden');
            }

            // ПРОВЕРКА НА 20 ЗВЕЗД
            if (favCount >= MAX_FAV && !secretUnlocked) {
                showSecretIsland();
            }
        }

        function updateCounter() {
            document.getElementById('fav-counter').innerText = `★ ${favCount} / ${MAX_FAV}`;
        }

        function saveToLocalStorage() {
            localStorage.setItem('spacePalettes', JSON.stringify(savedPalettes));
        }

        function generateNew() {
            const firstCard = document.querySelector('.card-wrapper:not(.hidden)');
            let newColors = [];
            let colorCount = Math.floor(Math.random() * 5) + 2;

            if (firstCard) {
                const oldColors = JSON.parse(firstCard.getAttribute('data-colors'));
                const lockItems = firstCard.querySelectorAll('.lock-item');
                let hasLocked = false;

                oldColors.forEach((c, i) => {
                    if (lockItems[i] && lockItems[i].classList.contains('locked')) {
                        newColors.push(c);
                        hasLocked = true;
                    } else {
                        newColors.push(getRandomColor());
                    }
                });

                if (!hasLocked && newColors.length !== colorCount) {
                    newColors = [];
                    for (let i = 0; i < colorCount; i++) newColors.push(getRandomColor());
                }
            } else {
                for (let i = 0; i < colorCount; i++) newColors.push(getRandomColor());
            }

            const container = document.getElementById('palette-container');
            const newCard = buildCard(newColors);
            container.insertBefore(newCard, container.firstChild);
            
            addToHistory(newColors);
            if (currentTab !== 'all') switchTab('all');
            showToast('Создана новая палитра!');
            updateCounter();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-all').classList.remove('active-tab');
            document.getElementById('tab-fav').classList.remove('active-tab');
            if(tab === 'all') document.getElementById('tab-all').classList.add('active-tab');
            if(tab === 'fav') document.getElementById('tab-fav').classList.add('active-tab');

            const cards = document.querySelectorAll('.card-wrapper');
            const title = document.getElementById('section-title');

            if (tab === 'all') {
                title.innerText = 'Все палитры';
                cards.forEach(c => c.classList.remove('hidden'));
            } else if (tab === 'fav') {
                title.innerText = 'Ваше избранное';
                cards.forEach(c => {
                    if (c.getAttribute('data-fav') === 'true') c.classList.remove('hidden');
                    else c.classList.add('hidden');
                });
                if (favCount === 0) showToast('В избранном пока пусто');
            }
        }

        function isDark(hex) {
            const r = parseInt(hex.substr(1, 2), 16);
            const g = parseInt(hex.substr(3, 2), 16);
            const b = parseInt(hex.substr(5, 2), 16);
            return (r * 299 + g * 587 + b * 114) / 1000 < 128;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        // --- ЛОГИКА СЕКРЕТНОГО ОСТРОВКА ---
        function showSecretIsland() {
            const island = document.getElementById('secretIsland');
            island.classList.add('show');
            
            if (!secretUnlocked) {
                localStorage.setItem('secretUnlocked', 'true');
                secretUnlocked = true;
            }

            const starsContainer = document.getElementById('islandStars');
            starsContainer.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const star = document.createElement('div');
                star.className = 'island-star';
                star.innerText = ['✦', '✧', '★'][Math.floor(Math.random() * 3)];
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = (Math.random() * 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        function closeIsland() {
            document.getElementById('secretIsland').classList.remove('show');
        }

        function initStars() {
            const container = document.getElementById('stars-container');
            const isMobile = window.innerWidth < 1024;
            // Добавили больше звезд для ПК
            const starCount = isMobile ? 25 : 80;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.innerText = ['✦', '✧', '★', '☆', '✴'][Math.floor(Math.random() * 5)];
                star.style.left = (Math.random() * 90 + 10) + '%';
                star.style.top = (Math.random() * 90 + 5) + '%';
                star.style.fontSize = (Math.random() * (isMobile ? 15 : 20) + (isMobile ? 10 : 12)) + 'px';
                const colors = ['#ffffff', 'var(--accent)', '#a1a1aa'];
                star.style.color = colors[Math.floor(Math.random() * colors.length)];
                star.style.opacity = Math.random() * 0.5 + 0.2;

                star.onclick = function(e) {
                    e.stopPropagation();
                    const randomX = (Math.random() - 0.5) * (isMobile ? 200 : 500);
                    const randomY = (Math.random() - 0.5) * (isMobile ? 200 : 500);
                    
                    star.classList.add('flying');
                    star.style.transform = `translate(${randomX}px, ${randomY}px) scale(4) rotate(360deg)`;
                    
                    setTimeout(() => {
                        star.classList.remove('flying');
                        star.style.transition = 'none';
                        star.style.transform = 'none';
                        star.style.left = (Math.random() * 90 + 10) + '%';
                        star.style.top = (Math.random() * 90 + 5) + '%';
                        star.style.opacity = Math.random() * 0.5 + 0.2;
                        setTimeout(() => star.style.transition = 'all 1.2s cubic-bezier(0.25, 1, 0.5, 1)', 50);
                    }, 1200);
                };
                container.appendChild(star);
            }
        }

        window.onload = function() {
            const container = document.getElementById('palette-container');
            
            savedPalettes.forEach((p) => {
                const card = buildCard(p.colors, true);
                container.appendChild(card);
                favCount++;
            });

            if (savedPalettes.length === 0) {
                for (let i = 0; i < 3; i++) {
                    const colors = [];
                    const colorCount = Math.floor(Math.random() * 5) + 2;
                    for (let j = 0; j < colorCount; j++) colors.push(getRandomColor());
                    container.appendChild(buildCard(colors));
                    addToHistory(colors);
                }
            }
            
            // Если при загрузке уже 20 палитр, показываем островок
            if (favCount >= MAX_FAV && !secretUnlocked) {
                setTimeout(showSecretIsland, 1000);
            }
            
            initStars();
            updateCounter();
            updateHistoryButtons();
        };
    </script>
</body>
</html>
